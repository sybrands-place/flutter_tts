// Migrated for AGP 9+ built-in Kotlin (builtInKotlin=true).
// - Removed legacy buildscript {} block: classpath dependencies are declared in settings.gradle
//   of the consuming app (Flutter toolchain manages Kotlin and AGP versions).
// - Removed `apply plugin: 'kotlin-android'`: built into AGP 9+ when builtInKotlin=true.
// - Removed `kotlinOptions {}`: replaced by compileOptions sourceCompatibility/targetCompatibility.
// - Removed `kotlin-stdlib` implementation: bundled by the Kotlin runtime from AGP 9+ toolchain.

def args = ["-Xlint:deprecation"]

group 'com.eyedeadevelopment.fluttertts'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

project.getTasks().withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(args)
}

apply plugin: 'com.android.library'

android {
    compileSdk 36
    if (project.android.hasProperty("namespace")) {
        namespace 'com.eyedeadevelopment.fluttertts'
    }

    defaultConfig {
        minSdkVersion 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lintOptions {
        disable 'InvalidPackage'
        disable 'GradleDependency'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

repositories {
    mavenCentral()
}
